<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#315c45">

  <title>Administration — Animal Perdu</title>

  <link rel="stylesheet" href="../css/style.css">

</head>

<body>

  <header class="topbar">
    <a class="brand" href="../index.html">
      <span class="mark">🐾</span>
      Animal Perdu
    </a>

    <button
      type="button"
      id="logout-button"
      class="admin-logout"
    >
      Déconnexion
    </button>
  </header>

  <main class="admin-container">

    <h1>Administration</h1>

    <p>
      Gestion des utilisateurs et des médailles Animal Perdu.
    </p>

    <section>
      <h2>Rechercher un utilisateur</h2>

      <form id="search-form" class="admin-search">
        <input
          type="email"
          id="search-email"
          placeholder="Adresse e-mail de l'utilisateur"
          aria-label="Adresse e-mail de l'utilisateur"
        >

        <button type="submit">
          Rechercher
        </button>
      </form>

      <p id="admin-feedback" class="admin-feedback" role="status"></p>
    </section>

    <section>
      <h2>Liste des médailles</h2>

      <div class="admin-table-wrapper">
        <table class="admin-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>E-mail du propriétaire</th>
              <th>Animal</th>
              <th>Statut</th>
              <th>Dernier scan</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="medals-list">
            <tr>
              <td colspan="6">
                Les médailles seront chargées ici.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

<script src="../js/api.js"></script>
<script src="../js/admin.js"></script>

</body>
</html>
