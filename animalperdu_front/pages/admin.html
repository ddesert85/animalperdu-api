<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#315c45">

  <title>Administration — Animal Perdu</title>

  <link rel="stylesheet" href="../css/style.css">

  <style>
    .admin-container {
      width: min(1200px, 94%);
      margin: 40px auto;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .admin-search {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 25px 0;
    }

    .admin-search input {
      flex: 1;
      min-width: 220px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .admin-search button,
    .admin-logout {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #315c45;
      color: white;
      cursor: pointer;
    }

    .admin-table-wrapper {
      overflow-x: auto;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .admin-table th,
    .admin-table td {
      padding: 14px;
      border-bottom: 1px solid #eee;
      white-space: nowrap;
    }

    .admin-table th {
      background: #f5f7f5;
      color: #315c45;
    }

    .admin-table tbody tr {
      cursor: pointer;
    }

    .admin-table tbody tr:hover {
      background: #f7faf7;
    }

    .admin-feedback {
      margin: 15px 0;
      color: #315c45;
    }

    @media (max-width: 600px) {
      .admin-header {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>


<body>

  <header class="topbar">
    <a class="brand" href="../index.html">
      <span class="mark">🐾</span>
      Animal Perdu
    </a>

    <button
      type="button"
      id="logout-button"
      class="admin-logout"
    >
      Déconnexion
    </button>
  </header>

  <main class="admin-container">

    <h1>Administration</h1>

    <p>
      Gestion des utilisateurs et des médailles Animal Perdu.
    </p>

    <section>
      <h2>Rechercher un utilisateur</h2>

      <form id="search-form" class="admin-search">
        <input
          type="email"
          id="search-email"
          placeholder="Adresse e-mail de l'utilisateur"
          aria-label="Adresse e-mail de l'utilisateur"
        >

        <button type="submit">
          Rechercher
        </button>
      </form>

      <p id="admin-feedback" class="admin-feedback" role="status"></p>
    </section>

    <section>
      <h2>Liste des médailles</h2>

      <div class="admin-table-wrapper">
        <table class="admin-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>E-mail du propriétaire</th>
              <th>Animal</th>
              <th>Statut</th>
              <th>Dernier scan</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="medals-list">
            <tr>
              <td colspan="6">
                Les médailles seront chargées ici.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>
  
<script src="../js/api.js"></script>
<script src="../js/admin.js"></script>

</body>
</html>
