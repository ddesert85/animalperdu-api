
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon espace propriétaire - Animal Perdu</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <header>
    <a href="../index.html">Animal Perdu</a>
    <button id="logout-button" type="button">Déconnexion</button>
  </header>

  <main class="auth-container">
    <h1>Mon espace propriétaire</h1>

    <p id="dashboard-feedback">Chargement de votre espace…</p>

    <section id="owner-information" hidden>
      <h2>Mes informations</h2>
      <p><strong>Nom :</strong> <span id="owner-name"></span></p>
      <p><strong>Email :</strong> <span id="owner-email"></span></p>
    </section>

    <section id="medals-section" hidden>

  <h2>Mes médailles</h2>

  <section class="medal-form-card">
    <h3>Ajouter une médaille</h3>

    <form id="medal-form">

      <div class="field">
        <label for="animal-name">Nom de l'animal *</label>
        <input
          type="text"
          id="animal-name"
          name="nom_animal"
          required
        >
      </div>

      <div class="field">
        <label for="animal-species">Espèce *</label>
        <select id="animal-species" name="espece" required>
          <option value="">Choisir une espèce</option>
          <option value="Chien">Chien</option>
          <option value="Chat">Chat</option>
          <option value="Autre">Autre</option>
        </select>
      </div>

      <div class="field">
        <label for="animal-breed">Race</label>
        <input
          type="text"
          id="animal-breed"
          name="race"
        >
      </div>

      <div class="field">
        <label for="animal-sex">Sexe</label>
        <select id="animal-sex" name="sexe">
          <option value="">Non renseigné</option>
          <option value="Mâle">Mâle</option>
          <option value="Femelle">Femelle</option>
        </select>
      </div>

      <div class="field">
        <label for="animal-birthdate">Date de naissance</label>
        <input
          type="date"
          id="animal-birthdate"
          name="date_naissance"
        >
      </div>

      <div class="field">
        <label for="animal-description">Description</label>
        <textarea
          id="animal-description"
          name="description"
          rows="3"
        ></textarea>
      </div>

      <div class="field">
        <label for="animal-health">Informations de santé</label>
        <textarea
          id="animal-health"
          name="informations_sante"
          rows="3"
        ></textarea>
      </div>

      <div class="field">
  <label for="animal-photo">Photo de l'animal</label>
  <input
    type="file"
    id="animal-photo"
    name="photo"
    accept="image/jpeg,image/png,image/webp"
  >
  <small>Formats acceptés : JPG, PNG et WebP.</small>
</div>

      <button type="submit" id="medal-submit" class="submit">
        Créer la médaille
      </button>

      <p id="medal-form-feedback" class="auth-feedback"></p>

    </form>
  </section>

  <h3>Mes médailles existantes</h3>

  <p id="medals-feedback">Chargement des médailles…</p>

  <div id="medals-list"></div>

</section>

  </main>

  <script src="../js/api.js"></script>
  <script src="../js/proprietaire.js"></script>

</body>
</html>
