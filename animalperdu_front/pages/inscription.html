
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#315c45">
  <title>Créer un compte — Animal Perdu</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../index.html">
      <span class="mark">🐾</span>Animal Perdu
    </a>
    <a class="nav" href="./connexion.html">Connexion</a>
  </header>

  <main>
    <section class="auth-wrap">
      <div class="auth-card">
        <h1>Créer un compte</h1>

        <p class="auth-lead">
          Créez votre espace propriétaire pour gérer les médailles de vos animaux.
        </p>

        <form id="register-form">
          <div class="field">
            <label for="register-name">Nom</label>
            <input
              id="register-name"
              name="nom"
              type="text"
              autocomplete="name"
              required
            >
          </div>

          <div class="field">
            <label for="register-phone">Téléphone</label>
            <input id="register-phone" name="telephone" type="tel" autocomplete="tel" required>
          </div>

          <div class="field">
            <label for="register-phone-secondary">Téléphone secondaire (facultatif)</label>
            <input id="register-phone-secondary" name="telephone_secondaire" type="tel" autocomplete="tel">
          </div>

          <div class="field">
            <label for="register-address">Adresse (facultatif)</label>
            <input id="register-address" name="adresse" autocomplete="street-address">
          </div>

          <div class="field">
            <label for="register-postal">Code postal (facultatif)</label>
            <input id="register-postal" name="code_postal" autocomplete="postal-code">
          </div>

          <div class="field">
            <label for="register-city">Ville (facultatif)</label>
            <input id="register-city" name="ville" autocomplete="address-level2">
          </div>

          <div class="field">
            <label for="register-email">Adresse e-mail</label>
            <input
              id="register-email"
              name="email"
              type="email"
              autocomplete="email"
              required
            >
          </div>

          <div class="field">
            <label for="register-password">
              Mot de passe (12 caractères minimum)
            </label>
            <input
              id="register-password"
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="12"
              required
            >
          </div>

          <div class="field">
            <label for="register-confirm">
              Confirmer le mot de passe
            </label>
            <input
              id="register-confirm"
              name="confirmation"
              type="password"
              autocomplete="new-password"
              minlength="12"
              required
            >
          </div>

          <button class="submit" id="register-submit" type="submit">
            Créer mon compte
          </button>

          <p
            class="auth-feedback"
            id="register-feedback"
            role="status"
            aria-live="polite"
          ></p>
        </form>

        <p class="auth-lead">
          Déjà un compte ?
          <a href="./connexion.html">Se connecter</a>
        </p>

        <a class="back-link" href="../index.html">
          ← Retour à l’accueil
        </a>
      </div>
    </section>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/inscription.js"></script>
</body>
</html>
