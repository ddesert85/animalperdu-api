<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#315c45">
  <title>Connexion — Animal Perdu</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../index.html"><span class="mark">🐾</span>Animal Perdu</a>
    <a class="nav" href="../index.html">Accueil</a>
  </header>

  <main>
    <section class="auth-wrap">
      <div class="auth-card">
        <h1>Connexion</h1>
        <p class="auth-lead">Connectez-vous à votre espace propriétaire pour retrouver vos médailles.</p>
        <form id="login-form">
          <div class="field">
            <label for="login-email">Adresse e-mail</label>
            <input id="login-email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="login-password">Mot de passe</label>
            <input id="login-password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="submit" id="login-submit" type="submit">Se connecter</button>
          <p class="auth-feedback" id="login-feedback" role="status" aria-live="polite"></p>
        </form>
        <a class="back-link" href="../index.html">← Retour à l’accueil</a>
      </div>
    </section>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/connexion.js"></script>
</body>
</html>
